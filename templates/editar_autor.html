{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h4>Editar Autor</h4>
    <form method="POST" action="{{ url_for('editar_autor', id=autor.idAutor) }}">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" value="{{ autor.nombre }}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="3">{{ autor.descripcion }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Actualizar Autor</button>
    </form>
</div>
{% endblock %}
