{% extends "layout.html" %}

{% block content %}
<div class="form-container">
    <form method="post">

     <div class="form-group">
    <label for="nombre"><i class="fas fa-id-card"></i> Nombre completo</label>
    <input type="text" class="form-control" id="nombre" name="nombre" required>
</div>

<div class="form-group">
    <label for="email"><i class="fas fa-envelope"></i> Email</label>
    <input type="email" class="form-control" id="email" name="email" required>
</div>

<div class="form-group">
    <label for="telefono"><i class="fas fa-phone"></i> Teléfono</label>
    <input type="tel" class="form-control" id="telefono" name="telefono" required>
</div>

<div class="form-group">
    <label for="direccion"><i class="fas fa-home"></i> Dirección</label>
    <input type="text" class="form-control" id="direccion" name="direccion" required>
</div>

<div class="form-group">
    <label for="contraseña"><i class="fas fa-lock"></i> Contraseña</label>
    <input type="password" class="form-control" id="contraseña" name="contraseña" required>
</div>

<button type="submit" class="btn" style="background: var(--accent);">
    <i class="fas fa-user-plus"></i> Registrarse
</button>
    </form>

    <div class="links">
        <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
        <a href="{{ url_for('start') }}">← Volver al inicio</a>
    </div>
</div>
{% endblock %}
