{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h4>Editar Género</h4>
    <form method="POST" action="{{ url_for('editar_genero', id=genero.idGenero) }}">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Género</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ genero.nombreGenero }}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="3">{{ genero.descripcion }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Actualizar Género</button>
    </form>
</div>
{% endblock %}
